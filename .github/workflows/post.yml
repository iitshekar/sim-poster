name: Daily simulation post

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 4:00 pm Dubai, every day
  workflow_dispatch:        # "Run workflow" button for a manual test

permissions:
  contents: write           # lets the job mark a simulation as posted

concurrency: daily-post     # never two posts at once

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: python post.py
      - name: Mark as posted
        run: |
          git config user.name "sim-poster bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet || git commit -m "Posted: $(date -u +%F)"
          git push
